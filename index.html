<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Saber Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">
  <style>
    .unread-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #ff4444;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .unread-badge {
      display: inline-block;
      background-color: #ff4444;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .all-read-hint {
      color: #999;
      font-style: italic;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Saber Docs',
      repo: 'raoxuanxuan/saber-docs',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索文档',
        noData: '没有找到结果',
      },
      auto2top: true,
      sidebarDisplayLevel: 1,
      plugins: [
        function(hook, vm) {
          var STORAGE_KEY = 'twitter-feed-read';

          function getReadSet() {
            try {
              return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
            } catch(e) {
              return new Set();
            }
          }

          function saveReadSet(readSet) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(readSet)));
          }

          function normalizePath(href) {
            if (!href) return '';
            var p = href;
            if (p.startsWith('#/')) p = p.substring(1);
            else if (p.startsWith('#')) p = '/' + p.substring(1);
            if (!p.startsWith('/')) p = '/' + p;
            p = p.replace(/\.md$/, '');
            return p;
          }

          function isTweetLink(path) {
            return /^\/twitter-feed\/[^\/]+\/\d{4}-\d{2}-\d{2}-/.test(path);
          }

          hook.doneEach(function() {
            var path = vm.route.path;
            var readSet = getReadSet();

            // Mark current tweet as read
            if (isTweetLink(path)) {
              readSet.add(path);
              saveReadSet(readSet);
            }

            // Main twitter-feed page: hide read articles, show red dots on unread
            if (path === '/twitter-feed/' || path === '/twitter-feed') {
              var content = document.querySelector('.markdown-section');
              if (!content) return;

              var h3List = content.querySelectorAll('h3');
              var anyUnread = false;

              h3List.forEach(function(h3) {
                var ul = h3.nextElementSibling;
                if (!ul || ul.tagName !== 'UL') return;

                var lis = ul.querySelectorAll('li');
                var unreadCount = 0;
                var totalCount = 0;

                lis.forEach(function(li) {
                  var link = li.querySelector('a[href]');
                  if (!link) return;
                  var normalized = normalizePath(link.getAttribute('href'));
                  if (!isTweetLink(normalized)) return;

                  totalCount++;
                  if (readSet.has(normalized)) {
                    li.style.display = 'none';
                  } else {
                    unreadCount++;
                    if (!link.querySelector('.unread-dot')) {
                      var dot = document.createElement('span');
                      dot.className = 'unread-dot';
                      link.insertBefore(dot, link.firstChild);
                    }
                  }
                });

                if (totalCount > 0 && unreadCount === 0) {
                  h3.style.display = 'none';
                  ul.style.display = 'none';
                } else if (unreadCount > 0) {
                  anyUnread = true;
                  if (!h3.querySelector('.unread-badge')) {
                    var badge = document.createElement('span');
                    badge.className = 'unread-badge';
                    badge.textContent = unreadCount;
                    badge.title = unreadCount + ' 篇未读';
                    h3.appendChild(badge);
                  }
                }
              });

              if (!anyUnread && h3List.length > 0) {
                var h2List = content.querySelectorAll('h2');
                h2List.forEach(function(h2) {
                  if (h2.textContent.includes('最新内容')) {
                    var next = h2.nextElementSibling;
                    if (!next || !next.classList.contains('all-read-hint')) {
                      var hint = document.createElement('p');
                      hint.className = 'all-read-hint';
                      hint.textContent = '所有文章已读，前往各用户推文页面查看历史文章。';
                      h2.parentNode.insertBefore(hint, h2.nextSibling);
                    }
                  }
                });
              }
            }

            // User feed pages: show all articles, red dot on unread
            var isUserFeed = /^\/twitter-feed\/[^\/]+\/?$/.test(path) &&
                             path !== '/twitter-feed/' && path !== '/twitter-feed';
            if (isUserFeed) {
              var content = document.querySelector('.markdown-section');
              if (!content) return;

              content.querySelectorAll('a[href]').forEach(function(link) {
                var normalized = normalizePath(link.getAttribute('href'));
                if (isTweetLink(normalized) && !readSet.has(normalized)) {
                  if (!link.querySelector('.unread-dot')) {
                    var dot = document.createElement('span');
                    dot.className = 'unread-dot';
                    link.insertBefore(dot, link.firstChild);
                  }
                }
              });
            }
          });
        }
      ],
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-protobuf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
